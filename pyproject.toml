[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlib-backend"
version = "0.1.0"
description = "SmartLib backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask==2.3.3",
  "flask-sqlalchemy==3.1.1",
  "flask-bcrypt==1.0.1",
  "flask-cors==4.0.0",
  "pymysql==1.1.0",
  "python-dotenv==1.0.0",
  "openpyxl==3.1.2",
  "reportlab==4.0.0",
  "cryptography"
]

[tool.setuptools.packages.find]
include = ["backend*"]

